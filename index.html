  <title>Cuponera</title>
  <!-- Ícono de la app: un cupón blanco con un corazón sobre fondo rosado.
       - Android (Chrome) toma el ícono del manifest (icon-192.png / icon-512.png): son "maskable", a sangre y sin
         transparencia, para que Android lo recorte en círculo o cuadro redondeado sin dejar borde blanco.
       - iPhone e iPad toman el "apple-touch-icon" (180 px, sin transparencia: iOS le pone las esquinas redondeadas).
       - Los navegadores de computador usan los PNG pequeños (32 y 64 px) en la pestaña.
       "apple-mobile-web-app-title" es el nombre corto que iPhone escribe bajo el ícono. -->
  <meta name="apple-mobile-web-app-title" content="Cuponera">
  <!-- Abrir como app desde el acceso directo (sin barra del navegador).
       La app tiene fondo lila claro, así que la barra de estado del iPhone usa texto oscuro ("default"). -->

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">

  <style>
    :root { --fondo: #ECE6F5; --boton: rgba(229, 72, 107, .92); }
    @media (prefers-color-scheme: dark) { :root { --fondo: #1C1529; } }
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      /* Mismo color que el fondo de la Cuponera, también detrás de la muesca y la barra de gestos */
      background: var(--fondo);
    }
    #contenedorIframe {
      position: fixed;
      /* Deja libre la muesca, la barra de estado y la barra de gestos (en computador valen 0) */
      top: env(safe-area-inset-top, 0px);
      right: env(safe-area-inset-right, 0px);
      bottom: env(safe-area-inset-bottom, 0px);
      left: env(safe-area-inset-left, 0px);
      background: var(--fondo);
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }
    /* Botón de pantalla completa: abajo a la izquierda, sobre la barra de gestos */
    #btnPantallaCompleta {
      position: fixed;
      left: calc(14px + env(safe-area-inset-left, 0px));
      bottom: calc(14px + env(safe-area-inset-bottom, 0px));
      z-index: 10;
      width: 44px;
      height: 44px;
      display: grid;
      place-items: center;
      padding: 0;
      background: var(--boton); /* rosado de la Cuponera */
      color: #fff;
      border: none;
      border-radius: 50%;
      box-shadow: 0 2px 10px rgba(0, 0, 0, .25);
      cursor: pointer;
    }
    #btnPantallaCompleta svg { width: 22px; height: 22px; }
    #btnPantallaCompleta:focus-visible { outline: 3px solid #F4B63F; outline-offset: 2px; }
    #btnPantallaCompleta[hidden] { display: none; }

    /* Pantalla de inicio: se ve mientras Apps Script carga la app (la primera vez tarda unos segundos) */
    #inicio {
      position: fixed; inset: 0; z-index: 20;
      display: grid; place-items: center; align-content: center; gap: 18px;
      background: var(--fondo); color: #2B1D3F;
      font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
      transition: opacity .35s ease;
    }
    #inicio.oculto { opacity: 0; pointer-events: none; }
    #inicio .tarda { display: none; max-width: 300px; text-align: center; font-size: 15px; line-height: 1.45; }
    #inicio.lento .tarda { display: block; }
    #inicio .tarda a, #inicio .tarda button {
      display: inline-block; margin: 10px 6px 0; padding: 10px 18px; border-radius: 999px; border: 0;
      background: #2B1D3F; color: #fff; font: inherit; font-weight: 700; text-decoration: none; cursor: pointer;
    }
    #inicio .tarda button { background: transparent; color: inherit; box-shadow: inset 0 0 0 2px rgba(43, 29, 63, .25); }
    #inicio img { width: 96px; height: 96px; border-radius: 24px; box-shadow: 0 10px 30px rgba(43, 29, 63, .18); }
    #inicio p { margin: 0; font-size: 26px; font-weight: 800; letter-spacing: -.02em; }
    #inicio .girando {
      width: 34px; height: 34px; border-radius: 50%;

    <p>Cuponera</p>
    <div class="girando" aria-hidden="true"></div>
    <div class="tarda">
      Está tardando más de lo normal.
      <br>
      <a id="abrirDirecto" target="_top" rel="noopener">Abrir directamente</a>
      <button type="button" onclick="location.reload()">Reintentar</button>
    </div>
  </div>
  <script>
    // Dirección de la app web de Apps Script de la Cuponera (termina en /exec)
    const URL_APP = 'https://script.google.com/macros/s/AKfycbxZ72rf5-L_GTe9ClrjMiZJww2JRWZZ5lexPKa1HPNoSy1BR3-QMAQefC6LgY4ln_SD/exec';

    // Se le pasan a la app los códigos que vengan en el link:
    //   ?invite=…  invitación a una cuponera
    //   ?ver=…     link para ver un cupón canjeado (el que se comparte por WhatsApp)
    // Los códigos son letras y números; se respetan mayúsculas y minúsculas.
    (function () {
      const q = new URLSearchParams(location.search);
      const limpiar = v => (v || '').replace(/[^a-zA-Z0-9]/g, '').slice(0, 40);
      const invite = limpiar(q.get('invite'));
      const ver = limpiar(q.get('ver'));
      const params = new URLSearchParams();
      if (invite) params.set('invite', invite);
      if (ver) params.set('ver', ver);
      const extra = params.toString();
      document.getElementById('miIframe').src = URL_APP + (extra ? '?' + extra : '');
      // El código de invitación se borra de la barra de direcciones para que no quede al recargar.
      // El de "ver" se mantiene, así ese link se puede recargar o volver a compartir.
      if (invite && !ver && history.replaceState) history.replaceState(null, '', location.pathname);
    })();

    const btn = document.getElementById('btnPantallaCompleta');
    const raiz = document.documentElement;
    const pedir = raiz.requestFullscreen || raiz.webkitRequestFullscreen;
    const salir = document.exitFullscreen || document.webkitExitFullscreen;
    const enPantallaCompleta = () => !!(document.fullscreenElement || document.webkitFullscreenElement);

    // Abierta desde el acceso directo (ya está en modo app)
    const comoApp = window.matchMedia('(display-mode: fullscreen), (display-mode: standalone)').matches
                 || window.navigator.standalone === true;

    // El botón aparece solo donde sirve: el navegador permite pantalla completa
    // (el iPhone no lo permite para páginas; el iPad y Android sí) y no se abrió como app.
    function actualizarBoton() {
      btn.hidden = !pedir || comoApp || enPantallaCompleta();
    }

    function alternarPantallaCompleta() {
      if (enPantallaCompleta()) { if (salir) salir.call(document); return; }
      if (!pedir) return;
      const r = pedir.call(raiz, { navigationUI: 'hide' });
      if (r && r.catch) r.catch(err => console.error('No se pudo activar pantalla completa: ' + err.message));
    }

    btn.addEventListener('click', alternarPantallaCompleta);

    // La pantalla de inicio se quita cuando la app avisa que está lista
    // (o, por si acaso, 12 segundos después de que cargue el iframe).
    const inicio = document.getElementById('inicio');
    function quitarInicio() {
      if (inicio.classList.contains('oculto')) return;
      inicio.classList.add('oculto');
      setTimeout(() => inicio.remove(), 400);
    }
    window.addEventListener('message', ev => {
      if (ev.data && ev.data.tipo === 'cuponera-lista') quitarInicio();
    });
    // Si la app es una versión que no avisa, se quita 4 s después de que cargue el iframe.
    document.getElementById('miIframe').addEventListener('load', () => setTimeout(quitarInicio, 4000));
    // Si a los 10 s sigue cargando, se ofrece abrir la app directo en Google (sin el contenedor).
    document.getElementById('abrirDirecto').href = URL_APP;
    setTimeout(() => inicio.classList.add('lento'), 10000);

    // La app (dentro del iframe) pide abrir WhatsApp: se abre desde aquí, que es la página principal.
    // Solo se aceptan mensajes de Apps Script y solo links de WhatsApp.
    window.addEventListener('message', ev => {
      const d = ev.data;
      if (!d || d.tipo !== 'cuponera-abrir' || typeof d.url !== 'string') return;
      let origenOk = false;
      try { origenOk = ev.origin === 'null' || /\.googleusercontent\.com$/.test(new URL(ev.origin).hostname); } catch (e) {}
      if (!origenOk) return;
      if (!/^https:\/\/(wa\.me|api\.whatsapp\.com)\//.test(d.url)) return;

      try { ev.source.postMessage({ tipo: 'cuponera-abierto', id: d.id }, '*'); } catch (e) {}
      const w = window.open(d.url, '_blank');
      if (w) { try { w.opener = null; } catch (e) {} }
      else location.href = d.url;   // si se bloqueó la ventana nueva, se abre en esta misma
    });
    document.addEventListener('fullscreenchange', actualizarBoton);
    document.addEventListener('webkitfullscreenchange', actualizarBoton);
    actualizarBoton();
  </script>

</body>
</html>
